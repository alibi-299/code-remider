<!doctype html>
<html>
  <head>
    <title>services</title>
  </head>
  <style>
    body {
      background: linear-gradient(
        310deg,
        #2a0c1b 0%,
        #2a0c1b 33%,
        #111c45 66%,
        #0c1433 100%
      );
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .header-container {
      position: relative;
      margin-top: 20px;
      text-align: center;
    }

    .header-container h1 {
      margin: 0;
      color: white;
    }

    .custom-button {
      background-color: #25ad45; /* green default */
      display: inline-block;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      margin: 0;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 0 #1e6f2f;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background-color 0.15s ease;
      color: white;
      position: absolute;
      left: 20px;
      top: 0;
    }

    .custom-button:hover {
      background-color: #c62828; /* red on hover */
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #8b1a1a;
    }

    .custom-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 0 #8b1a1a;
    }
  </style>
  <body>
    <div class="header-container">
      <a href="html code reminder.html" class="custom-button">back</a>
      <h1><strong>list for codes </strong></h1>

      <br />
      <br />
      <br />

      <h1><a style="color: #ffa500" href="html code.html"> html code</a></h1>

      <br />
      <br />
      <br />

      <h1><a style="color: #ffa500" href="pythoncode.html"> python code</a></h1>
    </div>
  </body>
</html>
