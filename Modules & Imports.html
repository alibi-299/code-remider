<!doctype html>
<html>
  <head>
    <title>Modules & Imports</title>
    <style>
      body {
        background-color: aqua;
      }
      .header-container {
        position: relative;
        margin-top: 20px;
        text-align: center;
      }

      .header-container h1 {
        margin: 0;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        max-width: 360px;
        width: auto;
        margin: 0;
        position: absolute;
        left: 20px;
        top: 0;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        color: #ffffff;
        background-color: #25ad45;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 0 #1e6f2f;
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease,
          background-color 0.12s ease;
      }
      .button:hover {
        background-color: #1e8b2f; /* darker green on hover */
        transform: translateY(-2px);
        box-shadow: 0 6px 0 #165a22;
      }
      .button:active {
        transform: translateY(0);
        box-shadow: 0 2px 0 #14561a;
      }

      .button:focus {
        outline: 3px solid rgba(37, 173, 69, 0.18);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <a class="button" href="pythoncode.html">back</a>
      <h1>Modules & Imports</h1>
    </div>
    <ul>
      <br />
      <h2>import</h2>
      <h3>
        Used to import modules or specific functions from modules into the
        current namespace.
      </h3>

      <h2>from</h2>
      <h3>
        Used in conjunction with import to import specific attributes or
        functions from a module.
      </h3>
    </ul>
  </body>
</html>
